services:
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - '5173:80'
    networks:
      - app-network
    volumes:
      - ./client:/app/client
      - /app/client/node_modules
      - ./shared:/app/shared:ro

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - '8000:8000'
    networks:
      - app-network
    volumes:
      - ./server:/app/server
      - /app/server/node_modules
      - ./shared:/app/shared:ro

networks:
  app-network:
    driver: bridge
